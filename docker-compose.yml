services:
  db:
    image: postgres:15.4
    container_name: my_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - .:/workspace
      - C:/Users/IVAN/Documents/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: osa-epi:0.1.0
    container_name: osa-epi-pipeline
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy